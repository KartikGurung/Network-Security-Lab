<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <linearGradient id="cyberBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00FF9C" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#263449" stroke-width="0.75" stroke-opacity="0.45" />
      <circle cx="40" cy="40" r="1" fill="#38BDF8" fill-opacity="0.25" />
    </pattern>

    <!-- Drop Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" fill="url(#bgGradient)" rx="16" />
  <rect width="1200" height="340" fill="url(#grid)" rx="16" />
  <rect width="1200" height="340" fill="url(#accentGlow)" rx="16" />

  <!-- Outer Border -->
  <rect x="1" y="1" width="1198" height="338" rx="15" fill="none" stroke="#263449" stroke-width="1.5" />

  <!-- Top Terminal Bar -->
  <rect x="24" y="24" width="1152" height="36" rx="8" fill="#111827" stroke="#263449" stroke-width="1" />
  <circle cx="46" cy="42" r="5" fill="#EF4444" opacity="0.8" />
  <circle cx="62" cy="42" r="5" fill="#F59E0B" opacity="0.8" />
  <circle cx="78" cy="42" r="5" fill="#10B981" opacity="0.8" />
  
  <text x="100" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Courier New', monospace" font-size="12" fill="#94A3B8" font-weight="500">
    sec-ops@netlab: ~/cybersecurity-portfolio <tspan fill="#38BDF8">on</tspan> <tspan fill="#00FF9C">git:(main)</tspan>
  </text>
  <rect x="1050" y="32" width="110" height="20" rx="4" fill="#0B0F19" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.6"/>
  <text x="1105" y="46" font-family="monospace" font-size="10" fill="#38BDF8" text-anchor="middle" font-weight="600">STATUS: SECURE</text>

  <!-- Center Decorative Technical Marks -->
  <g opacity="0.6" stroke="#263449" stroke-width="1">
    <line x1="24" y1="84" x2="60" y2="84" />
    <line x1="24" y1="84" x2="24" y2="120" />
    <line x1="1176" y1="84" x2="1140" y2="84" />
    <line x1="1176" y1="84" x2="1176" y2="120" />
    <line x1="24" y1="316" x2="60" y2="316" />
    <line x1="24" y1="316" x2="24" y2="280" />
    <line x1="1176" y1="316" x2="1140" y2="316" />
    <line x1="1176" y1="316" x2="1176" y2="280" />
  </g>

  <!-- Cyber Badge Tag -->
  <g transform="translate(64, 96)">
    <rect x="0" y="0" width="186" height="26" rx="13" fill="#111827" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.8" />
    <circle cx="14" cy="13" r="4" fill="#00FF9C" />
    <text x="26" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" fill="#38BDF8" font-weight="600" letter-spacing="1">
      SECURITY ENGINEERING
    </text>
  </g>

  <!-- Main Repository Title -->
  <text x="64" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">
    NETWORK SECURITY <tspan fill="url(#cyberBlue)">LAB</tspan>
  </text>

  <!-- Subtitle / Tagline -->
  <text x="64" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" fill="#94A3B8" font-weight="400">
    Applied Cryptography, Threat Analysis, Protocol Forensics &amp; Defensive Engineering
  </text>

  <!-- Technical Metric Cards on Right Side -->
  <g transform="translate(860, 110)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="280" height="52" rx="8" fill="#111827" stroke="#263449" stroke-width="1" />
    <text x="16" y="22" font-family="monospace" font-size="10" fill="#94A3B8" letter-spacing="0.5">DOMAIN COVERAGE</text>
    <text x="16" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#38BDF8">
      8 Comprehensive Labs
    </text>
    <circle cx="254" cy="26" r="6" fill="#38BDF8" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1.5" />

    <!-- Card 2 -->
    <rect x="0" y="62" width="280" height="52" rx="8" fill="#111827" stroke="#263449" stroke-width="1" />
    <text x="16" y="84" font-family="monospace" font-size="10" fill="#94A3B8" letter-spacing="0.5">FORENSICS &amp; PACKETS</text>
    <text x="16" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#00FF9C">
      Wireshark, Scapy &amp; PCAP
    </text>
    <circle cx="254" cy="88" r="6" fill="#00FF9C" fill-opacity="0.2" stroke="#00FF9C" stroke-width="1.5" />

    <!-- Card 3 -->
    <rect x="0" y="124" width="280" height="52" rx="8" fill="#111827" stroke="#263449" stroke-width="1" />
    <text x="16" y="146" font-family="monospace" font-size="10" fill="#94A3B8" letter-spacing="0.5">CRYPTOGRAPHIC RIGOR</text>
    <text x="16" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">
      X.509, OpenPGP, SHA-256
    </text>
    <circle cx="254" cy="150" r="6" fill="#F8FAFC" fill-opacity="0.2" stroke="#F8FAFC" stroke-width="1.5" />
  </g>

  <!-- Bottom Command Snippet Bar -->
  <g transform="translate(64, 240)">
    <rect x="0" y="0" width="760" height="48" rx="8" fill="#0D131F" stroke="#263449" stroke-width="1" />
    <text x="20" y="29" font-family="'Fira Code', 'JetBrains Mono', 'Courier New', monospace" font-size="13" fill="#00FF9C" font-weight="500">
      $ <tspan fill="#F8FAFC">git clone</tspan> <tspan fill="#94A3B8">https://github.com/KartikGurung/Network-Security-Lab.git</tspan>
    </text>
    <rect x="670" y="12" width="70" height="24" rx="4" fill="#111827" stroke="#263449" stroke-width="1" />
    <text x="705" y="28" font-family="monospace" font-size="10" fill="#38BDF8" text-anchor="middle" font-weight="600">STABLE</text>
  </g>

  <!-- Bottom Accent Stripe -->
  <line x1="24" y1="324" x2="1176" y2="324" stroke="#263449" stroke-width="1" />
  <line x1="64" y1="324" x2="300" y2="324" stroke="url(#cyberBlue)" stroke-width="2" />
</svg>
